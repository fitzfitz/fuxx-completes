# fuxx plugin manifest (design §8). fuxx installs this repo as a plugin: it puts bin/ on PATH and
# sources the zsh adapter in its zsh terminals. The release zip carries the prebuilt binary.
format      = 1
id          = fuxx-completes
name        = fuxx-completes
version     = 0.0.12
description = Grey ghost-text suggestions from your history and your project's commands, plus a list of 5 when you pause (zsh).
bin         = bin
zsh         = shell/fuxx-autosuggestions.plugin.zsh

# Settings fuxx shows on this plugin's card (Settings → Plugins, fuxx 0.12.6+). A changed value
# reaches the adapter as FUXX_PLUGIN_SETTING_<NAME> while fuxx sources it; the adapter checks it.
setting.list       = bool on    Show a suggestion list when you pause
setting.list_empty = bool on    Show the list on an empty line too
setting.list_delay = number 3   Seconds of pause before the list shows
setting.list_size  = number 5   Items in the list (1–5)
