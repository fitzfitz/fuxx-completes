# fuxx plugin manifest (design §8). fuxx installs this repo as a plugin: it puts bin/ on PATH and
# sources the zsh adapter in its zsh terminals. The release zip carries the prebuilt binary.
format      = 1
id          = fuxx-completes
name        = fuxx-completes
version     = 0.0.1
description = Grey ghost-text suggestions from your history as you type (zsh).
bin         = bin
zsh         = shell/fuxx-autosuggestions.plugin.zsh
