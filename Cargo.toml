[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "fuxx-autosuggestions",
    "fuxx-autocomplete",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fitzfitz/fuxx-completes"
homepage = "https://github.com/fitzfitz/fuxx-completes"
keywords = ["shell", "zsh", "bash", "autosuggestions", "history"]
categories = ["command-line-utilities"]

# The crates are built and released together: exact pins, so 0.1.x of one never pairs with 0.1.y
# of another. The path is used here; the version when published (crates.io).
[workspace.dependencies]
fuxx-completes-core = { path = "core", version = "=0.1.0" }
fuxx-autosuggestions = { path = "fuxx-autosuggestions", version = "=0.1.0" }

# Smaller release binary, same behaviour and speed (design §3: size and speed come first). No
# `panic = "abort"`: a worker thread that panics (the history reader) must not end the core.
[profile.release]
strip = true
lto = true
codegen-units = 1
