[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "fuxx-autosuggestions",
    "fuxx-autocomplete",
]

[workspace.package]
version = "0.0.8"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fitzfitz/fuxx-completes"

# Smaller release binary, same behaviour and speed (design §3: size and speed come first). No
# `panic = "abort"`: a worker thread that panics (the history reader) must not end the core.
[profile.release]
strip = true
lto = true
codegen-units = 1
