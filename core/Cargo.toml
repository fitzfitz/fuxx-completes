[package]
name = "fuxx-completes-core"
description = "The shared engine for fuxx-autosuggestions and fuxx-autocomplete"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { version = "1.8.7", default-features = false, features = ["pure"] }

[dev-dependencies]
tempfile = "3.27"

# Build time only: projects/*.toml becomes static Rust tables (no runtime cost, design §3).
[build-dependencies]
toml = "1.2"
serde = { version = "1", features = ["derive"] }
